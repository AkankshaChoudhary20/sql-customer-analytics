name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLite CLI and test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
          python -m pip install 'pytest>=8,<10'
      - name: Test retention, segmentation, and verification snapshots
        run: python -m pytest -q
      - name: Verify queries against the committed sample dataset
        run: |
          sqlite3 analytics.db < schema/schema.sql
          sqlite3 analytics.db < schema/seed.sql
          bash scripts/verify.sh
